# Configurações do Datadog
dd.service.name=datadog-logging-example
dd.env=development
dd.version=1.0.0
dd.agent.host=localhost
dd.agent.port=8126

# Logging configuration
logging.level.com.example=DEBUG
logging.level.root=INFO

# Custom properties para identificação
app.name=DatadogLoggingExample
app.environment=${DD_ENV:development}
app.version=${DD_VERSION:1.0.0}